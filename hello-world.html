<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World!</title>
<style>
  :root{
    --bg-1:#08080f;
    --bg-2:#12102a;
    --accent-1:#7c5cff;
    --accent-2:#00d4ff;
    --accent-3:#ff5c8a;
    --text:#f2f3ff;
    --muted:#9aa0c0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 55%, #050508 100%);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 流动极光光斑 ---------- */
  .aurora{
    position:fixed; inset:-30%;
    filter: blur(90px);
    opacity:.55;
    pointer-events:none;
    z-index:0;
  }
  .blob{
    position:absolute;
    width:46vmax; height:46vmax;
    border-radius:50%;
    mix-blend-mode: screen;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .blob.b1{ background: radial-gradient(circle at 30% 30%, #7c5cff, transparent 62%); top:2%;  left:6%;  animation-duration:24s; }
  .blob.b2{ background: radial-gradient(circle at 60% 40%, #00d4ff, transparent 62%); top:22%; right:4%; animation-duration:30s; animation-delay:-6s; }
  .blob.b3{ background: radial-gradient(circle at 50% 60%, #ff5c8a, transparent 62%); bottom:0%; left:34%; animation-duration:27s; animation-delay:-12s; }

  @keyframes drift{
    0%  { transform: translate3d(0,0,0) scale(1); }
    50% { transform: translate3d(6%,-7%,0) scale(1.12); }
    100%{ transform: translate3d(-6%,5%,0) scale(.94); }
  }

  /* ---------- 粒子 ---------- */
  #stars{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- 卡片 ---------- */
  .stage{
    position:relative; z-index:2;
    padding:0 24px;
    width:100%; max-width:820px;
    text-align:center;
    animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(26px); }
    to  { opacity:1; transform: translateY(0); }
  }

  .card{
    position:relative;
    padding: clamp(38px, 7vw, 76px) clamp(24px, 6vw, 64px);
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.022));
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.22);
    overflow:hidden;
  }
  /* 卡片顶部高光扫过 */
  .card::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.13) 48%, transparent 62%);
    transform: translateX(-120%);
    animation: sweep 6.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%,55%  { transform: translateX(-120%); }
    85%,100%{ transform: translateX(120%); }
  }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
    padding:7px 15px; margin-bottom:clamp(22px,4vw,34px);
    border-radius:999px;
    border:1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.045);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:#3ddc97;
    box-shadow: 0 0 0 0 rgba(61,220,151,.65);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%  { box-shadow: 0 0 0 0 rgba(61,220,151,.6); }
    70% { box-shadow: 0 0 0 9px rgba(61,220,151,0); }
    100%{ box-shadow: 0 0 0 0 rgba(61,220,151,0); }
  }

  h1{
    font-size: clamp(46px, 11vw, 118px);
    line-height:1.02;
    font-weight:800;
    letter-spacing:-.03em;
    background: linear-gradient(100deg, #ffffff 0%, #cbb8ff 22%, var(--accent-2) 48%, #ffffff 66%, var(--accent-3) 88%, #ffffff 100%);
    background-size: 260% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: flow 7s linear infinite;
    filter: drop-shadow(0 6px 40px rgba(124,92,255,.45));
  }
  @keyframes flow{
    0%  { background-position: 0% 50%; }
    100%{ background-position: 260% 50%; }
  }

  .sub{
    margin-top:clamp(18px,3vw,26px);
    font-size: clamp(13px, 1.6vw, 16px);
    color:var(--muted);
    letter-spacing:.26em;
    text-transform:uppercase;
  }
  .sub span{ color:var(--text); font-weight:600; }

  .line{
    width:74px; height:2px; margin: clamp(26px,4vw,36px) auto 0;
    border-radius:2px;
    background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), transparent);
    opacity:.9;
  }

  .hint{
    margin-top:18px;
    font-size:12.5px;
    color:rgba(154,160,192,.6);
    letter-spacing:.1em;
  }
  kbd{
    font-family:inherit;
    padding:2px 7px; margin:0 3px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);
    color:#dfe3ff;
    font-size:11.5px;
  }

  /* 光标 */
  .cursor{
    display:inline-block;
    width:.07em; height:.86em;
    margin-left:.06em;
    vertical-align:-.06em;
    background: linear-gradient(180deg, var(--accent-2), var(--accent-1));
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <canvas id="stars"></canvas>

  <main class="stage">
    <div class="card">
      <div class="badge"><span class="dot"></span>System Ready</div>
      <h1>Hello<span class="cursor"></span>World</h1>
      <p class="sub">你好，<span>世界</span></p>
      <div class="line"></div>
      <p class="hint">按下 <kbd>H</kbd> 让问候重新亮起</p>
    </div>
  </main>

<script>
(function(){
  /* ---------- 星尘粒子 ---------- */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, particles = [];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build(){
    const count = Math.min(140, Math.round((w * h) / 14000));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.6 + 0.35,
      vx: (Math.random() - 0.5) * 0.16,
      vy: -Math.random() * 0.26 - 0.05,
      a: Math.random() * 0.6 + 0.18,
      tw: Math.random() * Math.PI * 2
    }));
  }

  const palette = ['124,92,255', '0,212,255', '255,92,138', '255,255,255'];

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      p.tw += 0.02;

      if (p.y < -8){ p.y = h + 8; p.x = Math.random() * w; }
      if (p.x < -8) p.x = w + 8;
      if (p.x > w + 8) p.x = -8;

      const alpha = p.a * (0.55 + 0.45 * Math.sin(p.tw));
      const c = palette[(p.r * 10 | 0) % palette.length];

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${c},${alpha})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `rgba(${c},${alpha * 0.9})`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

  /* ---------- 按 H 重播动画 ---------- */
  const h1 = document.querySelector('h1');
  const cursor = document.querySelector('.cursor');
  const stage = document.querySelector('.stage');

  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'h'){
      // 重新触发卡片入场
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';

      // 打字效果
      const text = 'Hello';
      h1.innerHTML = '<span class="cursor"></span>';
      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length){
          h1.insertBefore(document.createTextNode(text[i]), h1.querySelector('.cursor'));
          i++;
        } else {
          clearInterval(timer);
          h1.insertBefore(document.createTextNode('World'), h1.querySelector('.cursor'));
        }
      }, 90);
    }
  });
})();
</script>
</body>
</html>
